name: SELENA TT&C preliminary validation
on:
  push:
    branches: [feature/ttc-initial-structure]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest numpy openpyxl
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Generate SELENA preliminary report
        run: python -m ttc.run_preliminary
      - name: Upload simulation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SELENA-TTC-preliminary
          path: |
            outputs/adaptive_storage_summary.json
            outputs/adaptive_storage_history.csv
            outputs/adaptive_contact_schedule.csv
            outputs/memory_sizing.json
            outputs/memory_sizing.csv
            outputs/adaptive_memory_history.svg
            outputs/SELENA_preliminary_report.md
          if-no-files-found: warn
